name: Release QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            controller: 6.0.11
            label: minimum-controller
          - os: ubuntu-latest
            node: 22
            controller: 7.2.2
            label: linux-node22
          - os: ubuntu-latest
            node: 24
            controller: 7.2.2
            label: linux-node24
          - os: ubuntu-latest
            node: 26
            controller: 7.2.2
            label: linux-node26
          - os: windows-latest
            node: 24
            controller: 7.2.2
            label: windows-node24
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HEIKO_TEST_CONTROLLER_VERSION: ${{ matrix.controller }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:regressions
      - run: npm audit --omit=dev --audit-level=low

      - name: Pack and verify release archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/heiko-offline-qa/packages"
          mkdir -p "$package_dir"
          npm pack --pack-destination "$package_dir"
          archive="$(find "$package_dir" -maxdepth 1 -type f -name 'iobroker.heiko-*.tgz' -print -quit)"
          test -n "$archive"
          node scripts/verify-release-package.cjs "$archive"
          printf 'HEIKO_RELEASE_TARBALL=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Pack and verify release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'heiko-offline-qa\packages'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          npm pack --pack-destination $packageDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (node -p "require('./package.json').version").Trim()
          $archive = Join-Path $packageDir "iobroker.heiko-$version.tgz"
          if (-not (Test-Path -LiteralPath $archive)) { throw 'npm pack did not create the expected archive' }
          node scripts\verify-release-package.cjs $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "HEIKO_RELEASE_TARBALL=$archive"

      - run: npm run test:integration
        env:
          HEIKO_QA_DIR: ${{ runner.temp }}/heiko-offline-qa
