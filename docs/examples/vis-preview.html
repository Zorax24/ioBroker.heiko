<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEIKO - VIS layout example</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#202b30;font-family:Arial,sans-serif;letter-spacing:0}main{max-width:1280px;margin:auto;padding:32px}header{display:flex;align-items:center;gap:20px;border-bottom:1px solid #d6dfe2;padding-bottom:24px}header img{width:90px;height:90px;object-fit:contain}h1{margin:0 0 8px;font-size:32px}p{margin:0;color:#52636b;line-height:1.5}.badge{margin-left:auto;padding:8px 12px;background:#fff3cc;color:#735700;border:1px solid #e8d58c;font-size:14px;border-radius:4px;max-width:260px;line-height:1.4}h2{font-size:20px;margin:28px 0 16px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric{background:white;border:1px solid #d6dfe2;border-top:3px solid #168f88;border-radius:4px;padding:20px;min-height:145px}.label{font-size:16px;min-height:38px;line-height:1.25}.value{font-size:34px;font-weight:600;margin:10px 0}.value small{font-size:20px;font-weight:400;color:#52636b}code{font-size:12px;color:#62717a;overflow-wrap:anywhere}.columns{display:grid;grid-template-columns:1fr 1fr;gap:32px}table{width:100%;border-collapse:collapse;background:white}td{padding:12px 16px;border-bottom:1px solid #e4eaec;font-size:15px}td:last-child{text-align:right;white-space:nowrap}.on{color:#19733f;font-weight:600}.off{color:#64727b}footer{margin-top:24px;padding-top:18px;border-top:1px solid #d6dfe2;font-size:14px;color:#52636b}@media(max-width:700px){main{padding:20px}header{flex-wrap:wrap}.badge{margin-left:0;max-width:none}.metrics{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.label{font-size:14px}.value{font-size:28px}h1{font-size:28px}header img{width:64px;height:64px}}
</style>
</head>
<body><main><header><img src="../../admin/heiko.png" alt="HEIKO"><div><h1>HEIKO</h1><p id="subtitle"></p></div><div class="badge" id="badge"></div></header><h2 id="measurements"></h2><section class="metrics" id="metrics"></section><div class="columns"><section><h2 id="operation"></h2><table id="status"></table></section><section><h2 id="refrigerant"></h2><table id="details"></table></section></div><footer id="footer"></footer></main>
<script>
const translations={
en:{subtitle:'Heat pump · Heating',badge:'VIS layout example · Simulated data',measurements:'Temperatures and operation',operation:'Operating states',refrigerant:'Refrigerant circuit and supply',footer:'Illustrative layout only. Not a bundled VIS project, no live connection and no control functions.',metrics:['Flow temperature','Return temperature','Effective flow target','Outdoor temperature','Compressor frequency','Outdoor fan speed'],status:['Compressor demand','Compressor running','Circulation pump P0','Outdoor fan 1','Flow switch','Defrost'],details:['High pressure Pd','Low pressure Ps','Discharge gas temperature','Suction gas temperature','Supply voltage','Electrical current'],on:'Active',off:'Inactive'},
de:{subtitle:'Wärmepumpe · Heizen',badge:'VIS-Gestaltungsbeispiel · Simulierte Daten',measurements:'Temperaturen und Betrieb',operation:'Betriebszustände',refrigerant:'Kältekreis und Versorgung',footer:'Reines Gestaltungsbeispiel. Kein mitgeliefertes VIS-Projekt, keine Live-Verbindung und keine Steuerfunktionen.',metrics:['Vorlauftemperatur','Rücklauftemperatur','Wirksamer Vorlauf-Sollwert','Außentemperatur','Verdichterfrequenz','Außengerät-Lüfter'],status:['Verdichteranforderung','Verdichter läuft','Umwälzpumpe P0','Außengerät-Lüfter 1','Strömungswächter','Abtauung'],details:['Hochdruck Pd','Niederdruck Ps','Heißgastemperatur','Sauggastemperatur','Versorgungsspannung','Stromaufnahme'],on:'Aktiv',off:'Inaktiv'},
pl:{subtitle:'Pompa ciepła · Ogrzewanie',badge:'Przykładowy układ VIS · Dane symulowane',measurements:'Temperatury i praca',operation:'Stany pracy',refrigerant:'Obieg chłodniczy i zasilanie',footer:'Wyłącznie przykład wyglądu. To nie jest gotowy projekt VIS; brak połączenia na żywo i funkcji sterowania.',metrics:['Temperatura zasilania','Temperatura powrotu','Efektywna temperatura zadana','Temperatura zewnętrzna','Częstotliwość sprężarki','Prędkość wentylatora'],status:['Żądanie pracy sprężarki','Sprężarka pracuje','Pompa obiegowa P0','Wentylator zewnętrzny 1','Czujnik przepływu','Odszranianie'],details:['Wysokie ciśnienie Pd','Niskie ciśnienie Ps','Temperatura tłoczenia','Temperatura gazu ssawnego','Napięcie zasilania','Pobór prądu'],on:'Aktywny',off:'Nieaktywny'}
};
const requested=new URLSearchParams(location.search).get('lang');const language=Object.hasOwn(translations,requested)?requested:'en';const t=translations[language];document.documentElement.lang=language;
t.status[0]={en:'Compressor demand (inferred)',de:'Verdichteranforderung (abgeleitet)',pl:'Zapotrzebowanie na sprężarkę (wywnioskowane)'}[language];
for(const id of ['subtitle','badge','measurements','operation','refrigerant','footer'])document.getElementById(id).textContent=t[id];
const metricData=[['Tuo',28.5,'°C'],['Tui',24.5,'°C'],['Setpoint',29,'°C'],['Ta',8.5,'°C'],['Frequency',42,'Hz'],['Fan1',620,'rpm']];
const format=value=>new Intl.NumberFormat(language,{maximumFractionDigits:1}).format(value);
function text(tag,value){const el=document.createElement(tag);el.textContent=value;return el;}
metricData.forEach(([id,value,unit],i)=>{const item=document.createElement('article');item.className='metric';const label=text('div',t.metrics[i]);label.className='label';item.append(label);const number=text('div',format(value)+' ');number.className='value';number.append(text('small',unit));item.append(number,text('code','heiko.0.realtime.'+id));document.getElementById('metrics').append(item);});
const statusIds=['compressorDemand','compressorRunning','pumpP0Running','fan1Running','flowSwitchActive','defrostActive'];
statusIds.forEach((id,i)=>{const tr=document.createElement('tr');const name=text('td',t.status[i]);name.append(document.createElement('br'),text('code','heiko.0.status.'+id));const value=text('td',i<5?t.on:t.off);value.className=i<5?'on':'off';tr.append(name,value);document.getElementById('status').append(tr);});
const detailData=[['Pd',22,'bar'],['Ps',7,'bar'],['Td',62,'°C'],['Ts',12.5,'°C'],['Voltage',230,'V'],['Current',5,'A']];
detailData.forEach(([id,value,unit],i)=>{const tr=document.createElement('tr');const name=text('td',t.details[i]);name.append(document.createElement('br'),text('code','heiko.0.realtime.'+id));tr.append(name,text('td',format(value)+' '+unit));document.getElementById('details').append(tr);});
</script></body></html>
